# CI — garde-fou de la chaîne de livraison (jalon M0).
# Aucun code ne rejoint la branche déployée sans : build vert, tests verts,
# audit des prompts. Les pushs directs sur la branche déployée exécutent aussi
# la CI (filet), mais la règle est : TOUT passe par une pull request.
name: CI

on:
  pull_request:
    branches: [claude/otome-game-builder-hqabza, main]
  push:
    branches: [claude/otome-game-builder-hqabza, 'routine/**', 'claude/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Audit sécurité des prompts (tokens interdits)
        run: npm run check:prompts --if-present
      - name: Tests unitaires
        run: npm test --if-present
      - name: Navigateur pour les tests e2e
        if: hashFiles('tests/e2e/run.mjs') != ''
        uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Tests e2e (filtre d'images + pipeline sécurité + parcours)
        if: hashFiles('tests/e2e/run.mjs') != ''
        env:
          CELESTINE_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:e2e --if-present
